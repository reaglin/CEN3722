<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cognitive_Walkthrough_Evalua</title>
  <style>
:root {
    --bg:         #ffffff;
    --surface:    #f8f9fa;
    --border:     #dee2e6;
    --accent:     #2563eb;
    --accent-bg:  #eff6ff;
    --text:       #1e293b;
    --muted:      #64748b;
    --bullet-bg:  #f1f5f9;
    --notes-bg:   #fefce8;
    --notes-border:#fbbf24;
    --code-bg:    #f8fafc;
    --code-border:#e2e8f0;
    --radius:     8px;
    --shadow:     0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.7; margin: 0; padding: 0; }
header { background: var(--accent); color: #fff; padding: 2.5rem 2rem 2rem; }
header h1 { margin: 0 0 .4rem; font-size: 2rem; font-weight: 700; }
header p  { margin: 0; opacity: .85; font-size: .95rem; }
main { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem 4rem; }
.slide-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.25rem; box-shadow: var(--shadow); overflow: hidden; }
.slide-header { display: flex; align-items: center; gap: 1rem; padding: .9rem 1.25rem; cursor: pointer; user-select: none; background: var(--accent-bg); border-bottom: 1px solid var(--border); }
.slide-header:hover { background: #dbeafe; }
.slide-num { background: var(--accent); color: #fff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 700; flex-shrink: 0; }
.slide-header h2 { margin: 0; font-size: 1.05rem; font-weight: 600; color: var(--text); flex: 1; }
.chevron { transition: transform .25s; font-size: .8rem; color: var(--muted); }
.slide-body { padding: 1.25rem; display: none; }
.slide-body.open { display: block; }
.bullets { list-style: none; margin: 0 0 1rem; padding: 0; }
.bullets li { background: var(--bullet-bg); border-radius: 6px; padding: .55rem .9rem; margin-bottom: .4rem; display: flex; gap: .6rem; align-items: flex-start; }
.bullets li::before { content: "•"; color: var(--accent); font-weight: 700; flex-shrink: 0; margin-top: .05rem; }
.notes { background: var(--notes-bg); border-left: 3px solid var(--notes-border); border-radius: 0 6px 6px 0; padding: .75rem 1rem; font-size: .9rem; color: var(--muted); margin-top: .5rem; }
.notes strong { display: block; margin-bottom: .25rem; color: #92400e; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; }
/* Document layout */
.doc-section { margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
.doc-section:last-child { border-bottom: none; }
.doc-section h2 { color: var(--accent); font-size: 1.4rem; margin: 0 0 1rem; display: flex; gap: .75rem; align-items: center; }
pre, code { font-family: 'Cascadia Code', 'Consolas', monospace; }
pre { background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 6px; padding: 1rem; overflow-x: auto; white-space: pre; line-height: 1.5; font-size: .9rem; }
  </style>
</head><body>
<div class="pm-backlink" style="font-family:'Segoe UI',Arial,sans-serif;padding:8px 16px;background:#f5f8fc;border-bottom:1px solid #dce3ec"><a href="../index.html" style="color:#1a3c6e;font-weight:600;text-decoration:none">↑ Cognitive Walkthrough Evaluation Method</a></div>
  <header>
    <h1>Cognitive_Walkthrough_Evalua</h1>
  </header><main>
  </main>
  <script>
    document.querySelectorAll('.slide-header').forEach(function(h){
      h.addEventListener('click',function(){
        var b=this.nextElementSibling,c=this.querySelector('.chevron'),o=b.classList.contains('open');
        b.classList.toggle('open',!o);c.style.transform=o?'':'rotate(90deg)';
      });});
    var f=document.querySelector('.slide-body');
    if(f){f.classList.add('open');var c=f.previousElementSibling.querySelector('.chevron');if(c)c.style.transform='rotate(90deg)';}
  </script>

<footer class="presemaker-credit" style="margin-top:2rem;padding:14px 0;border-top:1px solid #ddd;text-align:center;font:13px/1.4 -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#777;">Created with <a href="https://apps.microsoft.com/detail/9mt854nv3fgf?hl=en-US&amp;gl=US" target="_blank" rel="noopener" style="color:#3b6ea5;text-decoration:none;">PreseMaker</a></footer>
</body></html>
